# Integracao continua do servico de venda (ADR-008 da solucao).
# Roda no runner hospedado do GitHub, sem segredos e sem acesso ao cluster.
# Os nomes dos jobs sao required status checks da main: NAO renomear. Nao usar
# paths-ignore: os checks obrigatorios precisam rodar em todo PR.
# Os jobs `contrato`, `sonarcloud`, `imagem` e `infra` entram nos proximos PRs.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Um push novo no PR cancela a execucao anterior; na main nada e cancelado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependencias (uv.lock congelado)
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: Contratos de camadas e contextos (import-linter)
        run: uv run lint-imports

  testes:
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        # Mesma versao fixa do Terraform do servico (infra/terraform).
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Com TEST_MONGO_URL os testes de integracao usam o MongoDB real (sem ela, mongomock).
      TEST_MONGO_URL: mongodb://localhost:27017
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependencias (uv.lock congelado)
        run: uv sync --frozen

      - name: Unidade + integracao + BDD com cobertura (minimo 80%)
        run: >-
          uv run pytest -m "unit or integration or bdd"
          --cov=vendas --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Cobertura no resumo do job
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            echo "## Cobertura (unidade + integracao + BDD), MongoDB 8 real"
            echo
            echo '```'
            uv run coverage report --skip-covered | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publica relatorio de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  titulo-pr:
    name: titulo-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([a-z0-9._-]+\))?!?: .+'
          if [[ "$TITULO" =~ $padrao ]]; then
            echo "Titulo OK: $TITULO"
          else
            echo "::error::Titulo do PR fora do padrao Conventional Commits: '$TITULO'. Exemplo: 'feat(saga): compensacao do bloqueio'"
            exit 1
          fi
