# So dentro do cluster (ClusterIP), na porta 8000: e o endereco publicado como contrato para
# o principal (VENDAS_URL, destino da outbox) e o upstream do Kong. A entrada pelo host e o Kong:
# localhost:8080 -> NodePort 30080 -> Kong (namespace gateway) -> este Service.
apiVersion: v1
kind: Service
metadata:
  name: revenda-vendas
  labels:
    app: revenda-vendas
    app.kubernetes.io/name: revenda-vendas
    app.kubernetes.io/part-of: revenda-veiculos
spec:
  type: ClusterIP
  selector:
    app: revenda-vendas
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
