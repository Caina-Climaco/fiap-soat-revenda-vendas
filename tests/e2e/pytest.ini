# Configuracao propria dos testes e2e. Quando o pytest recebe `tests/e2e` como caminho,
# este arquivo vira o arquivo de configuracao (rootdir = tests/e2e), o que isola o e2e do
# pyproject.toml da aplicacao (cobertura, plugins) e impede o carregamento de conftest.py
# de diretorios acima.
# Execucao: pytest tests/e2e -m e2e -p no:cacheprovider -o addopts=""
[pytest]
markers =
    e2e: testes ponta a ponta contra o ambiente implantado (Kong em E2E_GATEWAY_URL)
    caos: usam kubectl contra o cluster: derrubam o principal, adiantam datas no banco e
        executam a recuperacao (exigem E2E_CAOS=1)
addopts = -ra
xfail_strict = true
