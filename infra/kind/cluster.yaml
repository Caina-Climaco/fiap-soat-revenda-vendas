# Cluster kind "revenda": a PLATAFORMA LOCAL compartilhada pelos dois servicos da Fase 4,
# cada um no seu namespace e com o seu proprio Terraform/state (ADR-006):
#   fiap-soat-revenda-principal -> namespaces principal (API e principal-db), gateway (Kong)
#                                  e observabilidade (Prometheus, Grafana, Collector, Jaeger)
#   fiap-soat-revenda-vendas    -> namespace vendas (API, MongoDB e CronJob de recuperacao)
# ESTE ARQUIVO E IDENTICO NOS DOIS REPOSITORIOS: o CD de cada um cria o cluster se ele
# ainda nao existir (quem chegar primeiro), sempre com a mesma configuracao. Uma mudanca
# aqui precisa de PR nos dois repositorios.
# Criado pela CLI kind (v0.33.0), NAO pelo Terraform: o provider comunitario tehcyx/kind
# nao tem assinatura de codigo e e bloqueado pelo Smart App Control do Windows 11.
#   kind get clusters | grep -qx revenda || kind create cluster --config infra/kind/cluster.yaml --wait 120s
# Portas do host so em 127.0.0.1 (nada exposto na rede local). Mudar este arquivo so
# tem efeito recriando o cluster. Um cluster "revenda" da Fase 3 nao tem a porta do Jaeger:
# o CD detecta e pede para recriar (scripts/windows/05-destruir-ambiente.ps1 -Cluster).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: revenda
networking:
  # Usada tambem nas NetworkPolicies dos bancos (variavel pod_subnet dos dois Terraform)
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    # Imagem do release kind v0.33.0 (Kubernetes 1.34 = mesmo minor do kubectl 1.34)
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
      # API Gateway (Kong, namespace gateway): entrada publica dos dois servicos e do Swagger
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      # principal-db (so responde quando expor_banco = true no Terraform do principal)
      - containerPort: 30432
        hostPort: 15432
        listenAddress: "127.0.0.1"
        protocol: TCP
      # vendas-db, MongoDB (so responde quando expor_banco = true no Terraform de vendas)
      - containerPort: 30017
        hostPort: 27017
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Grafana (namespace observabilidade)
      - containerPort: 30300
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Prometheus (namespace observabilidade)
      - containerPort: 30900
        hostPort: 9090
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Jaeger UI (namespace observabilidade): traces distribuidos (ADR-007)
      - containerPort: 30686
        hostPort: 16686
        listenAddress: "127.0.0.1"
        protocol: TCP
