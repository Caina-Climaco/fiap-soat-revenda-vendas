# SonarCloud (ADR-008 da solucao). Analise feita pelo job `sonarcloud` do CI, com a cobertura gerada
# pelo job `testes` (pytest-cov, coverage.xml). A analise automatica do SonarCloud fica
# desligada no projeto (Administration > Analysis Method), senao as duas competem.
sonar.organization=caina-climaco
sonar.projectKey=Caina-Climaco_fiap-soat-revenda-vendas
sonar.projectName=fiap-soat-revenda-vendas

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# O job falha quando o Quality Gate falha (check obrigatorio do PR)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
